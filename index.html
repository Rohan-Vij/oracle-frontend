<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400..700;1,400..700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='white'/%3E%3Ctext x='50' y='78' font-family='Helvetica,Arial,sans-serif' font-size='88' font-weight='bold' text-anchor='middle'%3E%3F%3C/text%3E%3C/svg%3E"
    />
    <title>Who Wins? — Norway vs England</title>
  </head>
  <body>
    <!-- Liquid-glass refraction filters, referenced from CSS via
         backdrop-filter: url(#...). Chromium renders true backdrop
         displacement; Safari/Firefox fall back to plain frost. -->
    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
      <defs>
        <!-- Edge-focused lensing per Apple's material: displacement ramps
             live in the outer 15% of the pane, the center stays calm.
             Two passes (X then Y) + a whisper of turbulence for life. -->
        <filter id="glass-lens" x="0%" y="0%" width="100%" height="100%">
          <feImage
            href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100' preserveAspectRatio='none'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='0'%3E%3Cstop offset='0' stop-color='rgb(0,128,128)'/%3E%3Cstop offset='0.15' stop-color='rgb(128,128,128)'/%3E%3Cstop offset='0.85' stop-color='rgb(128,128,128)'/%3E%3Cstop offset='1' stop-color='rgb(255,128,128)'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='100' height='100' fill='url(%23g)'/%3E%3C/svg%3E"
            x="0%"
            y="0%"
            width="100%"
            height="100%"
            preserveAspectRatio="none"
            result="mapx"
          />
          <feDisplacementMap
            in="SourceGraphic"
            in2="mapx"
            scale="80"
            xChannelSelector="R"
            yChannelSelector="B"
            result="dx"
          />
          <feImage
            href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100' preserveAspectRatio='none'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='0' y2='1'%3E%3Cstop offset='0' stop-color='rgb(128,0,128)'/%3E%3Cstop offset='0.15' stop-color='rgb(128,128,128)'/%3E%3Cstop offset='0.85' stop-color='rgb(128,128,128)'/%3E%3Cstop offset='1' stop-color='rgb(128,255,128)'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='100' height='100' fill='url(%23g)'/%3E%3C/svg%3E"
            x="0%"
            y="0%"
            width="100%"
            height="100%"
            preserveAspectRatio="none"
            result="mapy"
          />
          <feDisplacementMap
            in="dx"
            in2="mapy"
            scale="80"
            xChannelSelector="B"
            yChannelSelector="G"
            result="dy"
          />
          <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="1" seed="7" result="n" />
          <feDisplacementMap
            in="dy"
            in2="n"
            scale="10"
            xChannelSelector="R"
            yChannelSelector="G"
            result="dz"
          />
          <feGaussianBlur in="dz" stdDeviation="2" />
        </filter>
        <filter id="glass-lens-soft" x="-15%" y="-15%" width="130%" height="130%">
          <feTurbulence type="fractalNoise" baseFrequency="0.01 0.018" numOctaves="2" seed="11" result="noise" />
          <feGaussianBlur in="noise" stdDeviation="2" result="soft" />
          <feDisplacementMap
            in="SourceGraphic"
            in2="soft"
            scale="64"
            xChannelSelector="R"
            yChannelSelector="G"
            result="displaced"
          />
          <feGaussianBlur in="displaced" stdDeviation="2.5" />
        </filter>
      </defs>
    </svg>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
